<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Categories</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #f7f3ec; --card: #ffffff; --text: #1f2a24; --muted: #6b6f69;
    --green: #1e5b3a; --red: #b3262d; --gold: #ffe27a; --review: #ffb347;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { background: var(--green); color: #fff; padding: 14px 16px; text-align: center;
           font-weight: 700; font-size: 1.2rem; letter-spacing: .5px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px;
          box-shadow: 0 2px 10px rgba(0,0,0,.08); margin-bottom: 16px; }
  #book { font-size: 1.35rem; font-weight: 700; line-height: 1.3; text-align: center; }
  #book .by { font-weight: 400; color: var(--muted); }
  #category { margin: 14px auto 6px; padding: 14px; border-radius: 12px; text-align: center;
              font-size: 1.8rem; font-weight: 800; background: var(--gold); color: var(--red); }
  #category.review { background: var(--review); color: #5a2d00; }
  #shelf { text-align: center; font-size: 1.15rem; font-weight: 700; color: var(--green); }
  #reason { text-align: center; color: var(--muted); font-size: .95rem; margin-top: 8px; }
  #result { display: none; }
  #status { text-align: center; color: var(--muted); min-height: 1.4em; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; }
  button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 700; border: 0;
           border-radius: 12px; background: var(--red); color: #fff; cursor: pointer; }
  button.secondary { background: var(--green); margin-top: 10px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 10px; }
  form button { width: auto; padding: 12px 16px; font-size: 1rem; }
</style>
</head>
<body>
<header>🎄 Christmas Categories</header>
<main>
  <div class="card" id="result">
    <div id="book"></div>
    <div id="category"></div>
    <div id="shelf"></div>
    <div id="reason"></div>
    <button class="secondary" id="nextBtn">Scan Next Book</button>
  </div>

  <div class="card" id="scanCard">
    <div id="reader"></div>
    <p id="status">Tap “Start Scanning” and point the camera at the ISBN barcode.</p>
    <button id="startBtn">Start Scanning</button>
    <form id="manual">
      <input id="isbnInput" inputmode="numeric" placeholder="Or type the ISBN" autocomplete="off">
      <button type="submit">Go</button>
    </form>
  </div>
</main>

<script>
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const startBtn = document.getElementById('startBtn');
let scanner = null;
let busy = false;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function startScanner() {
  if (!window.Html5Qrcode) { statusEl.textContent = 'Scanner failed to load. Type the ISBN instead.'; return; }
  if (!scanner) {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false,
    });
  }
  busy = false;
  startBtn.style.display = 'none';
  statusEl.textContent = 'Point the camera at the barcode on the back of the book…';
  try {
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => ({ width: Math.min(w * 0.9, 380), height: Math.min(h * 0.45, 160) }) },
      onScan,
      () => {}
    );
  } catch (e) {
    startBtn.style.display = '';
    statusEl.textContent = 'Could not open the camera (' + e + '). You can type the ISBN below.';
  }
}

async function stopScanner() {
  try { if (scanner && scanner.isScanning) await scanner.stop(); } catch (e) {}
}

function onScan(text) {
  // Books use EAN-13 starting with 978 or 979 (skip price add-on barcodes)
  if (busy || !/^97[89]\d{10}$/.test(text)) return;
  busy = true;
  if (navigator.vibrate) navigator.vibrate(100);
  stopScanner();
  classify(text);
}

async function classify(isbn) {
  statusEl.textContent = 'Looking up ' + isbn + '…';
  resultEl.style.display = 'none';
  try {
    const r = await fetch('/api/classify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ isbn })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Lookup failed');
    show(d);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
    startBtn.style.display = '';
    startBtn.textContent = 'Try Again';
  }
}

function show(d) {
  document.getElementById('book').innerHTML =
    esc(d.title) + ' <span class="by">by</span> ' + esc(d.author);
  const cat = document.getElementById('category');
  cat.textContent = d.category;
  cat.classList.toggle('review', d.category === 'Needs Review');
  document.getElementById('shelf').textContent = d.shelf;
  document.getElementById('reason').textContent = d.reason || '';
  resultEl.style.display = 'block';
  document.getElementById('scanCard').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

startBtn.addEventListener('click', startScanner);
document.getElementById('nextBtn').addEventListener('click', () => {
  resultEl.style.display = 'none';
  document.getElementById('scanCard').style.display = '';
  document.getElementById('isbnInput').value = '';
  startScanner();
});
document.getElementById('manual').addEventListener('submit', e => {
  e.preventDefault();
  const v = document.getElementById('isbnInput').value.replace(/[^0-9Xx]/g, '');
  if (v) { stopScanner(); classify(v); }
});
</script>
</body>
</html>
